[project]
name = "sentinel-agent-worker"
version = "0.1.0"
description = "LangGraph infrastructure monitoring agent for Sentinel"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langchain-ollama>=0.3",
    "langchain-core>=0.3",
    "kafka-python-ng>=2.2",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
