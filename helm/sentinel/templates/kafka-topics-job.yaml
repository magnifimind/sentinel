{{- if .Values.kafka.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sentinel.fullname" . }}-kafka-topics
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "sentinel.labels" . | nindent 8 }}
        app.kubernetes.io/component: kafka-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -e
              BROKER="{{ .Release.Name }}-kafka:9092"
              echo "Waiting for Kafka at $BROKER..."
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BROKER" --list >/dev/null 2>&1; do
                echo "  Kafka not ready, retrying in 5s..."
                sleep 5
              done
              echo "Kafka is ready."

              {{- range .Values.kafkaTopics }}
              echo "Creating topic {{ .name }}..."
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BROKER" \
                --create --if-not-exists \
                --topic {{ .name }} \
                --partitions {{ .partitions | default 3 }} \
                --replication-factor {{ .replicationFactor | default 1 }}
              {{- end }}

              echo "All topics created."
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BROKER" --list
{{- end }}
