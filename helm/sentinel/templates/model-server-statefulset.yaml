{{- if .Values.modelServer.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sentinel.fullname" . }}-model-server
  labels:
    {{- include "sentinel.modelServer.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "sentinel.fullname" . }}-model-server
  selector:
    matchLabels:
      {{- include "sentinel.modelServer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinel.modelServer.labels" . | nindent 8 }}
    spec:
      runtimeClassName: {{ .Values.modelServer.runtimeClassName }}
      containers:
        - name: ollama
          image: "{{ .Values.modelServer.image.repository }}:{{ .Values.modelServer.image.tag }}"
          imagePullPolicy: {{ .Values.modelServer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.modelServer.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.modelServer.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.modelServer.persistence.size }}
{{- end }}
